# Inference-extension demo on kind: 3 simulator pods form an InferencePool;
# the Endpoint Picker chooses a pod per request using their vLLM metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-pool
  namespace: llm-serving
spec:
  replicas: 3
  selector: {matchLabels: {app: sim-pool}}
  template:
    metadata:
      labels: {app: sim-pool, ai.lab/inference-engine: vllm}
    spec:
      containers:
        - name: sim
          image: SIM_IMAGE
          args: [--model=Qwen/Qwen3-8B, --port=8000, --mode=random, --time-to-first-token=200, --inter-token-latency=30, --max-num-seqs=4]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata: {name: sim-pool, namespace: llm-serving}
spec:
  parentRefs:
    - {name: ai-gateway, namespace: ai-gateway, kind: Gateway, group: gateway.networking.k8s.io}
  rules:
    - matches: [{headers: [{type: Exact, name: x-ai-eg-model, value: Qwen/Qwen3-8B}]}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: sim-pool}
