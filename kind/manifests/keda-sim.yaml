# Same pattern as inference/06-autoscaling, aimed at the simulator.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sim-llama8b
  namespace: llm-serving
spec:
  scaleTargetRef: {name: sim-llama8b}
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://kps-prometheus.monitoring.svc:9090
        query: sum(vllm:num_requests_waiting{namespace="llm-serving", pod=~"sim-llama8b-.*"})
        threshold: "2"
