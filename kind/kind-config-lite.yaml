# Low-memory profile (Docker with ~8 GB): control plane + 2 "GPU" workers.
# System add-ons share the GPU-sim workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-lab
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
  - role: worker
    labels:
      ai.lab/node-pool: gpu-sim
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: SIM-GPU-80GB
  - role: worker
    labels:
      ai.lab/node-pool: gpu-sim
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: SIM-GPU-80GB
