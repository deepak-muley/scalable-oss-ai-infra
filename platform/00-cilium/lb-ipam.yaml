# EDIT: a free range on your lab LAN (not served by DHCP).
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lab-pool
spec:
  blocks:
    - start: 192.168.1.240
      stop: 192.168.1.250
---
# Answer ARP for LoadBalancer IPs from worker nodes.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2
spec:
  loadBalancerIPs: true
  externalIPs: false
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+                 # adjust to your NIC naming
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
