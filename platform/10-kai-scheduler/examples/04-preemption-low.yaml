# Step 1 of the priority demo. notebooks.gpu.limit is 1.
# Apply this, wait until the pod is Running, then apply 04-preemption-high.yaml.
# The chart's PriorityClass "train" has value 50 and is preemptible.
apiVersion: v1
kind: Pod
metadata:
  name: kai-train-low
  namespace: training
  labels:
    app: kai-preempt
    kai.scheduler/queue: notebooks
spec:
  schedulerName: kai-scheduler
  priorityClassName: train
  restartPolicy: Never
  containers:
    - name: work
      image: busybox:1.36
      command: ["sh", "-c", "echo low priority training; sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {nvidia.com/gpu: "1"}
