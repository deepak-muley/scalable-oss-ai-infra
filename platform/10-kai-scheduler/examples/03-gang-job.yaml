# Gang scheduling. parallelism is 2 and batch-min-member is 2, so KAI starts
# both pods or neither. That is what a torchrun / NCCL job needs: rank 0
# waiting alone at the rendezvous is a hung job, not a running one.
#
# Try it: cordon one GPU node, or scale the queue, until only 1 GPU is free.
# kubectl get podgroups -n training   should show the group waiting.
# kubectl describe job -n training kai-gang
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-gang
  namespace: training
  annotations:
    kai.scheduler/batch-min-member: "2"
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    metadata:
      labels:
        kai.scheduler/queue: distributed-training
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.36
          command: ["sh", "-c", "echo rank started on $(hostname); sleep 600"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {nvidia.com/gpu: "1"}
