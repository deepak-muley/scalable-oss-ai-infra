# Burst / fallback to an external OpenAI-compatible provider. Clients keep
# calling the lab gateway; the provider key lives only in this Secret.
#
# NOTE: BackendSecurityPolicy wiring changed across AI Gateway releases
# (backendSecurityPolicyRef on AIServiceBackend in older versions vs
# targetRefs on the policy in newer ones). Check
# `kubectl explain backendsecuritypolicy.spec` for your version.
apiVersion: v1
kind: Secret
metadata:
  name: external-llm-apikey
  namespace: ai-gateway
type: Opaque
stringData:
  apiKey: "REPLACE_ME"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: external-openai
  namespace: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.openai.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: external-openai-tls
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: external-openai
  validation:
    wellKnownCACertificates: System
    hostname: api.openai.com
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIServiceBackend
metadata:
  name: external-openai
  namespace: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: external-openai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: BackendSecurityPolicy
metadata:
  name: external-openai-apikey
  namespace: ai-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: external-openai
  type: APIKey
  apiKey:
    secretRef:
      name: external-llm-apikey
      namespace: ai-gateway
