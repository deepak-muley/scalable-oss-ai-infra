# Per-user TOKEN budget: each distinct x-user-id may consume 100k total tokens
# per hour. Request cost is 0 at admission; the real cost (llm_total_token
# from AIGatewayRoute.llmRequestCosts) is charged when the response finishes.
#
# Requires Envoy Gateway installed with WITH_RATELIMIT=true (Redis).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: token-budget
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 100000      # interpreted as tokens because of `cost`
            unit: Hour
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
