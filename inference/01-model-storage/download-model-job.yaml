# Pre-downloads a model into the shared cache so vLLM pods start fast.
# Re-run with a different MODEL for each model you want warm.
apiVersion: batch/v1
kind: Job
metadata:
  name: download-model
  namespace: llm-serving
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: download
          image: python:3.12-slim
          env:
            - {name: MODEL, value: "Qwen/Qwen2.5-7B-Instruct"}
            - {name: HF_HOME, value: /models/hf}
            - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "1"}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}
          command: ["bash", "-c"]
          args:
            - |
              pip install -q "huggingface_hub[hf_transfer]" && \
              python -c "import os; from huggingface_hub import snapshot_download; \
                p = snapshot_download(os.environ['MODEL'], allow_patterns=['*.json','*.safetensors','*.model','*.txt','*.py','*.tiktoken']); print('downloaded to', p)"
          resources:
            requests: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: model-cache}
