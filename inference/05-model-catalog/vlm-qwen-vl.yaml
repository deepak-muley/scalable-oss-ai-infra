apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-vl
  namespace: llm-serving
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm-qwen-vl}}
  template:
    metadata:
      labels: {app: vllm-qwen-vl, ai.lab/inference-engine: vllm}
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen2.5-VL-7B-Instruct
            - --port=8000
            - --max-model-len=32768
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching
            # cap images per prompt (JSON form in recent vLLM):
            - --limit-mm-per-prompt={"image":4}
          env: [{name: HF_HOME, value: /models/hf}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 90}
          resources:
            requests: {cpu: "6", memory: 48Gi}
            limits: {nvidia.com/gpu: 1}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-vl
  namespace: llm-serving
spec:
  selector: {app: vllm-qwen-vl}
  ports: [{name: http, port: 8000, targetPort: 8000}]
