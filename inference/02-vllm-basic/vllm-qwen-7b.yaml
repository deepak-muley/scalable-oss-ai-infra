apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-7b
  namespace: llm-serving
  labels: {app: vllm-qwen-7b}
spec:
  replicas: 1
  strategy:
    type: Recreate              # don't need 2x GPUs during a rollout in a lab
  selector:
    matchLabels: {app: vllm-qwen-7b}
  template:
    metadata:
      labels:
        app: vllm-qwen-7b
        ai.lab/inference-engine: vllm      # scraped by platform/06-monitoring PodMonitor
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2   # pin; bump deliberately
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen2.5-7B-Instruct
            - --host=0.0.0.0
            - --port=8000
            - --gpu-memory-utilization=0.90
            - --max-model-len=32768
            - --enable-prefix-caching
            - --disable-log-requests
          env:
            - {name: HF_HOME, value: /models/hf}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:                     # loading weights + CUDA graph capture is slow
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90            # up to 15 min
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: "4", memory: 32Gi}
            limits: {nvidia.com/gpu: 1, memory: 48Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: model-cache}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-7b
  namespace: llm-serving
spec:
  selector: {app: vllm-qwen-7b}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
