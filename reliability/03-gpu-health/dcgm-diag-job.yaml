# Pre-flight / post-repair validation: run DCGM diagnostics on ALL GPUs of
# one node before it (re)joins the pool. Level 2 ~ a few minutes; level 3/4
# are long burn-in tests (use after hardware repair).
#
#   NODE=gpu-node-1 GPUS=8 envsubst < dcgm-diag-job.yaml | kubectl apply -f -
#   kubectl -n gpu-health logs -f job/dcgm-diag-${NODE}
#
# Node must be cordoned? No — nodeName bypasses the scheduler, so this runs
# on a cordoned node, which is exactly the "validate before uncordon" step.
apiVersion: batch/v1
kind: Job
metadata:
  name: dcgm-diag-${NODE}
  namespace: gpu-health
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeName: ${NODE}
      restartPolicy: Never
      runtimeClassName: nvidia
      tolerations: [{operator: Exists}]
      containers:
        - name: dcgm
          # pin a tag matching your driver; see nvcr.io/nvidia/cloud-native/dcgm tags
          image: nvcr.io/nvidia/cloud-native/dcgm:3.3.9-1-ubuntu22.04
          command: ["bash", "-c"]
          args:
            - |
              nv-hostengine -n &          # embedded DCGM host engine
              sleep 3
              dcgmi discovery -l
              dcgmi diag -r 2 && echo "DCGM DIAG PASSED on ${NODE}" || { echo "DCGM DIAG FAILED on ${NODE}"; exit 1; }
          securityContext:
            capabilities: {add: [SYS_ADMIN]}   # profiling/diag access
          resources:
            limits: {nvidia.com/gpu: "${GPUS}"}
