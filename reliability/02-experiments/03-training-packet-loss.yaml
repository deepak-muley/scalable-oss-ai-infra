# Targets the pods of trainjob-pytorch-ddp (JobSet label set by Kubeflow Trainer).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: training-packet-loss
  namespace: chaos-mesh
spec:
  action: loss
  mode: all
  selector:
    namespaces: [training]
    labelSelectors:
      jobset.sigs.k8s.io/jobset-name: ddp-synthetic
  loss:
    loss: "5"
    correlation: "25"
  duration: 3m
# Only affects traffic over the pod network (eth0). NCCL over RDMA/IB
# (secondary net1) bypasses tc — inject faults there with link flaps instead.
