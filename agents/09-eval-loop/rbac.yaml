apiVersion: v1
kind: ServiceAccount
metadata:
  name: skill-release
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skill-release
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["agent-skills"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skill-release
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skill-release
subjects:
  - {kind: ServiceAccount, name: skill-release, namespace: agents}
