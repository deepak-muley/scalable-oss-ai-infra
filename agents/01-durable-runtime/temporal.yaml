# Lab Temporal: one process, SQLite, Web UI. This is temporal server start-dev.
# It skips production checks. For a real cluster use the temporalio helm chart
# with Postgres: https://github.com/temporalio/helm-charts
# install.sh substitutes TEMPORAL_CLI_VERSION from versions.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: agents
  labels: {app: temporal}
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal}}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:TEMPORAL_CLI_VERSION
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --db-filename
            - /data/temporal.db
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: ui, containerPort: 8233}
          readinessProbe:
            tcpSocket: {port: 7233}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: agents
spec:
  selector: {app: temporal}
  ports:
    - {name: grpc, port: 7233, targetPort: 7233}
    - {name: ui, port: 8233, targetPort: 8233}
---
# The worker image is stock Python. install.sh mounts worker.py from a
# ConfigMap and the container pip-installs temporalio into /tmp/py on start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: agents
  labels: {app: agent-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-worker}}
  template:
    metadata:
      labels: {app: agent-worker}
    spec:
      serviceAccountName: agent-worker
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: worker
          image: python:3.12-slim
          command: ["bash", "-c"]
          args:
            - |
              pip install -q --target=/tmp/py 'temporalio>=1.9,<2'
              exec python /app/worker.py worker
          env:
            - {name: TEMPORAL_ADDRESS, value: "temporal.agents.svc:7233"}
            - {name: TOOL_GATEWAY_URL, value: "http://tool-gateway.agents.svc:8090"}
            - {name: TASK_QUEUE, value: agent-tasks}
            - {name: PYTHONPATH, value: /tmp/py}
            - {name: HOME, value: /tmp}
          startupProbe:
            exec:
              command: ["python", "-c", "import temporalio"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["python", "-c", "import temporalio"]
            periodSeconds: 10
          volumeMounts:
            - {name: src, mountPath: /app}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: src
          configMap: {name: agent-worker-src}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker
  namespace: agents
