# Apply only after `runsc` is installed on the node (see README).
# Until then the pod stays Pending with FailedCreatePodSandBox.
# The tool gateway allows exec_code only when the caller sets sandbox=gvisor.
apiVersion: v1
kind: Pod
metadata:
  name: code-exec-sandbox
  namespace: agents
  labels: {app: code-exec-sandbox}
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  containers:
    - name: sandbox
      image: python:3.12-slim
      command: ["python", "-c", "print('sandbox runtime ok')"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
