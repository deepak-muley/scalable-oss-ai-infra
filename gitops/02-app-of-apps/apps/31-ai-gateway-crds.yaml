apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: ai-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system
  sources:
    - repoURL: docker.io/envoyproxy
      chart: ai-gateway-crds-helm
      targetRevision: "v0.3.0"
      helm:
        releaseName: aieg-crd
  syncPolicy:
    automated:
      selfHeal: true      # revert manual drift
      prune: false        # lab safety: deleting a file does not delete CRDs/PVCs; flip once confident
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
