apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-release-pipeline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ai-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: training
  sources:
    - repoURL: https://github.com/deepak-muley/scalable-oss-ai-infra.git
      targetRevision: main
      path: pipelines/02-model-release-pipeline
      directory:
        include: '*.yaml'
  syncPolicy:
    automated:
      selfHeal: true      # revert manual drift
      prune: false        # lab safety: deleting a file does not delete CRDs/PVCs; flip once confident
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
