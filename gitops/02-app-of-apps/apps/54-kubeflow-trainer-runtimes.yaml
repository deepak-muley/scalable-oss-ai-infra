apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-trainer-runtimes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ai-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow-system
  sources:
    - repoURL: https://github.com/kubeflow/trainer.git
      targetRevision: v2.0.0
      path: manifests/overlays/runtimes
  syncPolicy:
    automated:
      selfHeal: true      # revert manual drift
      prune: false        # lab safety: deleting a file does not delete CRDs/PVCs; flip once confident
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
