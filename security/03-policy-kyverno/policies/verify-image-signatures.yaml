# Example: require cosign keyless signatures (GitHub Actions OIDC) on images
# YOU build (fine-tuned model servers, training images). Upstream images are
# mostly unsigned today, so scope this to your org.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  rules:
    - name: cosign-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences: ["ghcr.io/YOUR_ORG/*"]
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: "https://github.com/YOUR_ORG/*"
                    rekor:
                      url: https://rekor.sigstore.dev
