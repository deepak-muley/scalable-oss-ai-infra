# ESO API is external-secrets.io/v1 in recent releases (v1beta1 in older ones).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:                   # OpenBao speaks the Vault API
      server: http://openbao.security.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          namespace: security
          key: token
