# hf-token in llm-serving, sourced from OpenBao secret/ai-lab/huggingface
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: llm-serving
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: hf-token, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: ai-lab/huggingface, property: token}
---
# Gateway client API keys (bao kv put secret/ai-lab/gateway-keys alice=sk-... bob=sk-...)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-api-keys
  namespace: ai-gateway
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: ai-gateway-api-keys, creationPolicy: Owner}
  dataFrom:
    - extract: {key: ai-lab/gateway-keys}
