# WORKER cluster: ordinary Kueue setup. Same namespace + LocalQueue name as the manager.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: fleet-cq
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: default-flavor
          resources:
            - {name: cpu, nominalQuota: 8}
            - {name: memory, nominalQuota: 16Gi}
            - {name: nvidia.com/gpu, nominalQuota: 8}
---
apiVersion: v1
kind: Namespace
metadata:
  name: training
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: research
  namespace: training
spec:
  clusterQueue: fleet-cq
