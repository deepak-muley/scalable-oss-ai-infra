apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-lab-gpu-platform
  namespace: monitoring
spec:
  groups:
    - name: ai-lab.gpu
      rules:
        - alert: GPUXidError
          # DCGM_FI_DEV_XID_ERRORS is a GAUGE holding the code of the LAST XID
          # seen on that GPU (0 = none). Some XIDs (13, 31, 43) are usually
          # application bugs; 48/63/64/74/79/94/95 usually mean hardware -> cordon.
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          labels: {severity: critical}
          annotations:
            summary: "XID {{ $value }} on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
            description: "Check dmesg on the node; reliability/03-gpu-health remediator will cordon it."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#platform
        - alert: GPUTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} at {{ $value }}°C"
            description: "Sustained >85°C causes clock throttling (slower training steps / tokens). Check airflow, fans, power capping."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#platform
        - alert: GPUAllocatedButIdle
          # dcgm-exporter adds pod/namespace labels for GPUs assigned to pods.
          # Approximation: a GPU attached to a pod with <5% util for 30 min.
          # Serving pods at night are legitimately idle -> scope or silence as needed.
          expr: max by (Hostname, gpu, namespace, pod) (DCGM_FI_DEV_GPU_UTIL{pod!=""}) < 5
          for: 30m
          labels: {severity: info}
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} holds GPU {{ $labels.gpu }} on {{ $labels.Hostname }} but uses <5%"
            description: "Money on fire: forgotten notebook, hung job, or over-provisioned replicas. Consider scale-to-zero or Kueue."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#platform
    - name: ai-lab.scheduling
      rules:
        - alert: KueueWorkloadsPendingTooLong
          expr: sum by (cluster_queue) (kueue_pending_workloads{status="active"}) > 0
          for: 2h
          labels: {severity: warning}
          annotations:
            summary: "ClusterQueue {{ $labels.cluster_queue }} has had pending workloads for 2h"
            description: "Quota too small, a stuck high-priority job, or no borrowable capacity in the cohort. kubectl get workloads -A."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#platform
        - alert: KueueInadmissibleWorkloads
          expr: sum by (cluster_queue) (kueue_pending_workloads{status="inadmissible"}) > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Workloads in {{ $labels.cluster_queue }} can never be admitted as configured"
            description: "Usually requests exceed the queue's total quota or no ResourceFlavor matches. kubectl describe workload."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#platform
    - name: ai-lab.gateway
      rules:
        - alert: GatewayUpstream5xxHigh
          # Envoy cluster stats; cluster names encode the route/backend.
          expr: |
            sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m]))
              / clamp_min(sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total[5m])), 1e-9) > 0.05
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "{{ $value | humanizePercentage }} 5xx from {{ $labels.envoy_cluster_name }}"
            description: "Model backend failing or overloaded (503 from no healthy endpoints, 504 timeouts on long generations)."
            runbook_url: https://github.com/deepak-muley/scalable-oss-ai-infra/blob/main/docs/13-troubleshooting.md#inference
