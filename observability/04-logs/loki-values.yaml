deploymentMode: SingleBinary
loki:
  auth_enabled: false                  # single tenant lab
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # MinIO instead (bucket must exist, creds from training/01):
  # storage:
  #   type: s3
  #   bucketNames: {chunks: loki, ruler: loki, admin: loki}
  #   s3:
  #     endpoint: http://minio.mlops.svc.cluster.local:9000
  #     s3ForcePathStyle: true
  #     insecure: true
  #     accessKeyId: ${AWS_ACCESS_KEY_ID}
  #     secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem       # s3 when using MinIO
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 168h             # 7 days
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}
# scalable-mode components off
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}              # Service "loki:3100" directly
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
