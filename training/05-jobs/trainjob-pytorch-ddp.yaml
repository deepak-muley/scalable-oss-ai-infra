# Multi-node data-parallel training: 2 nodes x 1 GPU (edit to taste).
# Synthetic data so it runs anywhere; swap in your model/dataset.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: ddp-synthetic
  namespace: training
  labels:
    kueue.x-k8s.io/queue-name: research
spec:
  runtimeRef:
    name: torch-distributed
  trainer:
    numNodes: 2
    image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
    resourcesPerNode:
      limits:
        nvidia.com/gpu: 1
      requests:
        cpu: "4"
        memory: 16Gi
    env:
      - {name: NCCL_DEBUG, value: WARN}
    command:
      - bash
      - -c
      - |
        cat > /tmp/train.py <<'PY'
        import os, time, torch, torch.nn as nn, torch.distributed as dist
        from torch.nn.parallel import DistributedDataParallel as DDP

        dist.init_process_group("nccl")
        rank, world = dist.get_rank(), dist.get_world_size()
        local_rank = int(os.environ.get("LOCAL_RANK", 0))
        torch.cuda.set_device(local_rank)
        print(f"rank {rank}/{world} on {torch.cuda.get_device_name(local_rank)}", flush=True)

        model = nn.Sequential(nn.Linear(4096, 8192), nn.GELU(), nn.Linear(8192, 4096)).cuda()
        model = DDP(model, device_ids=[local_rank])
        opt = torch.optim.AdamW(model.parameters(), lr=1e-4)
        t0 = time.time()
        for step in range(300):
            x = torch.randn(64, 4096, device="cuda")
            loss = (model(x) - x).pow(2).mean()          # learn identity
            opt.zero_grad(); loss.backward(); opt.step()  # grads all-reduced by DDP/NCCL
            if step % 50 == 0 and rank == 0:
                print(f"step {step} loss {loss.item():.4f} {time.time()-t0:.1f}s", flush=True)
        dist.destroy_process_group()
        PY
        torchrun /tmp/train.py
