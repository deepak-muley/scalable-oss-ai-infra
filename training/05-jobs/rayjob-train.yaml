# Ray Train on an ephemeral Ray cluster: KubeRay creates the cluster, runs
# the entrypoint, then deletes the cluster. Kueue admits it as one unit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-train-script
  namespace: training
data:
  train.py: |
    import torch, torch.nn as nn, ray
    import ray.train, ray.train.torch
    from ray.train import ScalingConfig
    from ray.train.torch import TorchTrainer

    def train_loop(cfg):
        model = ray.train.torch.prepare_model(
            nn.Sequential(nn.Linear(1024, 4096), nn.ReLU(), nn.Linear(4096, 1)))
        device = ray.train.torch.get_device()
        opt = torch.optim.AdamW(model.parameters(), lr=1e-3)
        for step in range(cfg["steps"]):
            x = torch.randn(256, 1024, device=device)
            y = x.sum(dim=1, keepdim=True)
            loss = nn.functional.mse_loss(model(x), y)
            opt.zero_grad(); loss.backward(); opt.step()
            if step % 50 == 0:
                ray.train.report({"step": step, "loss": loss.item()})

    trainer = TorchTrainer(
        train_loop,
        train_loop_config={"steps": 500},
        scaling_config=ScalingConfig(num_workers=2, use_gpu=True),
    )
    result = trainer.fit()
    print("final metrics:", result.metrics)
---
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-train-synthetic
  namespace: training
  labels:
    kueue.x-k8s.io/queue-name: research
spec:
  entrypoint: python /home/ray/jobs/train.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-gpus: "0"
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray-llm:2.46.0-py311-cu124
              resources:
                requests: {cpu: "2", memory: 8Gi}
                limits: {memory: 8Gi}
              volumeMounts: [{name: script, mountPath: /home/ray/jobs}]
          volumes:
            - {name: script, configMap: {name: ray-train-script}}
    workerGroupSpecs:
      - groupName: gpu
        replicas: 2
        minReplicas: 2
        maxReplicas: 2
        rayStartParams: {}
        template:
          spec:
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: rayproject/ray-llm:2.46.0-py311-cu124
                resources:
                  requests: {cpu: "4", memory: 16Gi}
                  limits: {nvidia.com/gpu: 1, memory: 24Gi}
                volumeMounts: [{name: shm, mountPath: /dev/shm}]
            volumes:
              - {name: shm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
