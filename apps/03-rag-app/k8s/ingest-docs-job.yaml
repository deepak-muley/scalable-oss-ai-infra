# "Chat with the lab docs": clone this repo and ingest every *.md into Qdrant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-docs-script
  namespace: apps
data:
  ingest_docs.py: |
    import json, os, pathlib, urllib.request
    root = pathlib.Path(os.environ.get("DOCS_DIR", "/repo"))
    url = os.environ.get("RAG_URL", "http://rag-app.apps.svc.cluster.local") + "/ingest"
    files = sorted(p for p in root.rglob("*.md") if ".git" not in p.parts)
    for i in range(0, len(files), 10):
        docs = [{"source": str(p.relative_to(root)), "text": p.read_text(errors="ignore")} for p in files[i:i + 10]]
        req = urllib.request.Request(url, data=json.dumps({"documents": docs}).encode(),
                                     headers={"content-type": "application/json"})
        with urllib.request.urlopen(req, timeout=600) as resp:
            print([d["source"] for d in docs], "->", resp.read().decode())
    print(f"ingested {len(files)} files")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-lab-docs
  namespace: apps
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          # change to your fork/branch; the repo must be pushed first
          args: ["clone", "--depth=1", "https://github.com/deepak-muley/scalable-oss-ai-infra.git", "/repo"]
          volumeMounts: [{name: repo, mountPath: /repo}]
      containers:
        - name: ingest
          image: python:3.12-slim
          command: ["python", "/scripts/ingest_docs.py"]
          env:
            - {name: DOCS_DIR, value: /repo}
            - {name: RAG_URL, value: "http://rag-app.apps.svc.cluster.local"}
          volumeMounts:
            - {name: repo, mountPath: /repo}
            - {name: script, mountPath: /scripts}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
      volumes:
        - {name: repo, emptyDir: {}}
        - {name: script, configMap: {name: ingest-docs-script}}
